user_visible_outputs = [
  "/app/bin/gasketd",
  "/app/buscards",
  "/app/mistwell/roster.json",
  "/app/corkbay/seal.json",
  "/app/opscribe/MAP.txt",
]
internal_harness_files = [
  "/app/opscribe/COUNT_SRC.txt",
  "/app/loomkit/emit.lst",
  "/app/cardbak/buscards",
]

[structured_outputs.jab_json]
