user_visible_outputs = [
  "/app/bin/rimlock",
  "/app/planbay/live.plan",
  "/app/planbay/alt.plan",
  "/app/planbay/mill.ok",
  "/app/scrollbay/desk.chk",
  "/app/desknote/ROUTE.txt",
  "/app/desknote/forms.txt",
  "/app/inkurn/book.tsv",
  "/app/vatdock/shift.dmp",
  "/app/vatdock/dusk.dmp",
]

internal_harness_files = [
  "/app/stoke.sh",
]

[structured_outputs.plan]
target = "/app/planbay/live.plan"
format = "text"
instruction_checks = ["identity", "unjam"]

[structured_outputs.scroll]
target = "/app/scrollbay/desk.chk"
format = "text"
instruction_checks = ["tid", "tag"]
