user_visible_outputs = [
  "/app/symmill/fold/runtime",
  "/app/symmill/fold/runtime.symmap",
  "/app/symmill/fold/profile.json",
  "/app/benchframes/bench.samples",
  "/app/symmill/ops/pipeline.map",
  "/app/symmill/contract.md",
]

internal_harness_files = []

[structured_outputs.profile]
target = "/app/symmill/fold/profile.json"
format = "json"
instruction_checks = ["symbol", "offset", "frames"]

[structured_outputs.symmap]
target = "/app/symmill/fold/runtime.symmap"
format = "text"
instruction_checks = ["PCFOLD1", "mode", "buildid", "sym"]
