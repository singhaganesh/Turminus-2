user_visible_outputs = [
  "/app/bin/twinefuse",
  "/app/dockurn/rows.ndjson",
  "/app/dockurn/hitch.idx",
  "/app/dockurn/berth.ok",
  "/app/dockurn/mornbox/rows.ndjson",
  "/app/dockurn/mornbox/hitch.idx",
  "/app/millnote/LAY.txt",
  "/app/millnote/ROUTE.txt",
  "/app/cordbay/eve.yarn",
  "/app/cordbay/morn.yarn",
  "/app/aliascue",
]

internal_harness_files = [
  "/app/hull.sh",
  "/tmp/twinefuse.ref",
]

[structured_outputs.rows]
target = "/app/dockurn/rows.ndjson"
format = "ndjson"
instruction_checks = ["id", "hitch", "tok"]

[structured_outputs.idx]
target = "/app/dockurn/hitch.idx"
format = "text"
instruction_checks = ["hitch"]
