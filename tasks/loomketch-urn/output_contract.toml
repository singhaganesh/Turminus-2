user_visible_outputs = [
  "/app/bin/loomketch",
  "/app/inkbay/bound.json",
  "/app/inkbay/desk.tsv",
  "/app/inkbay/GUARD",
  "/app/deskcue/MAP.txt",
]
internal_harness_files = [
  "/app/hearth.sh",
  "/app/tplbay/bound.tpl",
  "/app/seed/vatlogs",
]

[structured_outputs.bound]
target = "/app/inkbay/bound.json"
format = "json"
instruction_checks = ["findings", "issue", "kind", "frames", "body"]

[structured_outputs.desk]
target = "/app/inkbay/desk.tsv"
format = "tsv"
instruction_checks = ["issue", "kind", "body"]
