user_visible_outputs = [
  "/app/bin/wickpane",
  "/app/loomwell/etch.json",
  "/app/loomwell/pair.sha",
  "/app/shardops/bins.json",
  "/app/crumbay",
  "/app/shardops/live",
  "/app/bindnote/LAYOUT.txt",
  "/app/bindnote/GRAMMAR.txt",
]
internal_harness_files = [
  "/app/Makefile",
]

[structured_outputs.etch]
target = "/app/loomwell/etch.json"
format = "json"
instruction_checks = ["pane", "mod!fn"]

[structured_outputs.bins]
target = "/app/shardops/bins.json"
format = "json"
instruction_checks = ["pane", "BAD"]
